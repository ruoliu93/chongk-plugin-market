# chongk-plugin-market 的 bundle patch：把插件行插入 profile roster。
#
# 作为 profile bundle 层生效（package.json 的 dsh.bundle.patch 字段），安装方式：
#   dsh plugin --profile <profile> add link:<repo>/chongk-plugin-market
#
# 只插入一行：宿主半区（lib/index.js）提供 /api/plugin-market/* 路由，
# 浏览器半区（exports["./client"] → lib/client.js）负责侧栏入口与中栏插件浏览器。
- insert:
    - id: plugin-market
      name: 'chongk-plugin-market'
      config:
        # 目录数据随包发布；换成 http(s) 地址可以从远端目录拉取
        catalog: ''
